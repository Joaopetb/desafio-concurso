<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio de Consistência - Concurso</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen transition-colors duration-200">

    <!-- HEADER -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2.5 rounded-xl text-white shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-fire text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight">Desafio de Consistência</h1>
                    <p class="text-xs text-slate-400">Foco na meta, um dia de cada vez 🎯</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="alternarTema()" class="p-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-300 transition" title="Alternar Tema">
                    <i id="icone-tema" class="fa-solid fa-sun"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

        <!-- FORMULÁRIO DE REGISTRO -->
        <section class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl">
            <h2 class="text-base font-semibold mb-4 flex items-center text-indigo-400">
                <i class="fa-solid fa-plus-circle mr-2"></i> Registrar Estudo de Hoje
            </h2>
            <form id="form-estudo" onsubmit="registrarEstudo(event)" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Seu Nome</label>
                    <input type="text" id="nome" required placeholder="Ex: João Pedro" 
                        class="w-full bg-slate-900 border border-slate-750 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Tempo Estudado</label>
                    <div class="flex space-x-2">
                        <input type="number" id="tempo" required min="1" placeholder="Min" 
                            class="w-full bg-slate-900 border border-slate-750 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Matéria / Foco</label>
                    <input type="text" id="materia" placeholder="Ex: Direito Constitucional" 
                        class="w-full bg-slate-900 border border-slate-750 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
                <div class="flex items-end">
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-4 rounded-xl text-sm transition shadow-lg shadow-indigo-600/20 flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-check"></i>
                        <span>Lançar</span>
                    </button>
                </div>
            </form>
        </section>

        <!-- PLACAR / RANKING SEMANAL -->
        <section class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-5 gap-3">
                <div>
                    <h2 class="text-base font-semibold flex items-center text-amber-400">
                        <i class="fa-solid fa-trophy mr-2"></i> Ranking da Semana
                    </h2>
                    <p class="text-xs text-slate-400">Acumulado de minutos estudados no período</p>
                </div>
                <button onclick="copiarRankingWhatsApp()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium py-2 px-3.5 rounded-lg transition flex items-center space-x-2 shadow-lg shadow-emerald-600/20">
                    <i class="fa-brands fa-whatsapp text-sm"></i>
                    <span>Copiar Ranking p/ WhatsApp</span>
                </button>
            </div>

            <!-- Lista do Ranking -->
            <div id="lista-ranking" class="space-y-3">
                <!-- Preenchido via JavaScript -->
            </div>
        </section>

        <!-- HISTÓRICO RECENTE -->
        <section class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl">
            <h2 class="text-base font-semibold mb-3 flex items-center text-slate-300">
                <i class="fa-solid fa-clock-rotate-left mr-2"></i> Últimos Registros do Grupo
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-900/50 text-slate-400 text-xs uppercase">
                        <tr>
                            <th class="p-3 rounded-l-lg">Participante</th>
                            <th class="p-3">Tempo</th>
                            <th class="p-3">Matéria</th>
                            <th class="p-3 rounded-r-lg">Data</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-historico" class="divide-y divide-slate-700/50 text-slate-300">
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="text-center py-6 text-xs text-slate-500">
        Grupo de Cobrança Diária para Concurseiros 🚀 Feito para manter a consistência.
    </footer>

    <!-- SCRIPT DE FUNCIONAMENTO -->
    <script>
        let registros = JSON.parse(localStorage.getItem('registros_estudo')) || [];

        function registrarEstudo(event) {
            event.preventDefault();
            
            const nome = document.getElementById('nome').value.trim();
            const tempo = parseInt(document.getElementById('tempo').value);
            const materia = document.getElementById('materia').value.trim() || 'Geral';
            const data = new Date().toLocaleDateString('pt-BR');
            const dataIso = new Date().toISOString();

            const novoRegistro = { id: Date.now(), nome, tempo, materia, data, dataIso };
            registros.unshift(novoRegistro);

            localStorage.setItem('registros_estudo', JSON.stringify(registros));

            document.getElementById('form-estudo').reset();
            atualizarTela();
        }

        function calcularRanking() {
            let acumulado = {};

            registros.forEach(reg => {
                if (!acumulado[reg.nome]) {
                    acumulado[reg.nome] = 0;
                }
                acumulado[reg.nome] += reg.tempo;
            });

            let rankingArray = Object.keys(acumulado).map(nome => ({
                nome,
                totalMinutos: acumulado[nome]
            }));

            rankingArray.sort((a, b) => b.totalMinutos - a.totalMinutos);
            return rankingArray;
        }

        function formatarTempo(minutos) {
            const horas = Math.floor(minutos / 60);
            const mins = minutos % 60;
            if (horas === 0) return `${mins}m`;
            if (mins === 0) return `${horas}h`;
            return `${horas}h ${mins}m`;
        }

        function atualizarTela() {
            const ranking = calcularRanking();
            const containerRanking = document.getElementById('lista-ranking');
            const corpoTabela = document.getElementById('tabela-historico');

            if (ranking.length === 0) {
                containerRanking.innerHTML = `<p class="text-slate-400 text-sm text-center py-4">Nenhum estudo registrado ainda. Seja o primeiro hoje!</p>`;
            } else {
                let maxMinutos = ranking[0].totalMinutos || 1;
                containerRanking.innerHTML = ranking.map((item, index) => {
                    let medalha = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}º`;
                    let porcentagem = Math.min(Math.round((item.totalMinutos / maxMinutos) * 100), 100);

                    return `
                        <div class="bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/50">
                            <div class="flex justify-between items-center mb-1.5 text-sm">
                                <div class="font-medium flex items-center space-x-2">
                                    <span class="w-6 text-center">${medalha}</span>
                                    <span>${item.nome}</span>
                                </div>
                                <span class="font-bold text-indigo-400">${formatarTempo(item.totalMinutos)}</span>
                            </div>
                            <div class="w-full bg-slate-750 h-2 rounded-full overflow-hidden bg-slate-700">
                                <div class="bg-indigo-500 h-full rounded-full transition-all duration-500" style="width: ${porcentagem}%"></div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            if (registros.length === 0) {
                corpoTabela.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400">Nenhum registro recente.</td></tr>`;
            } else {
                corpoTabela.innerHTML = registros.slice(0, 10).map(reg => `
                    <tr class="border-b border-slate-700/30 hover:bg-slate-900/30">
                        <td class="p-3 font-medium text-slate-200">${reg.nome}</td>
                        <td class="p-3 text-indigo-300 font-semibold">${formatarTempo(reg.tempo)}</td>
                        <td class="p-3 text-slate-400">${reg.materia}</td>
                        <td class="p-3 text-slate-500 text-xs">${reg.data}</td>
                    </tr>
                `).join('');
            }
        }

        function copiarRankingWhatsApp() {
            const ranking = calcularRanking();
            if (ranking.length === 0) {
                alert("Ainda não há dados no ranking para copiar!");
                return;
            }

            let texto = "🏆 *RANKING DE CONSISTÊNCIA - ESTUDOS* 📚\n\n";
            ranking.forEach((item, index) => {
                let icone = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : "▪️";
                texto += `${icone} *${item.nome}* — ${formatarTempo(item.totalMinutos)}\n`;
            });
            texto += "\n🔥 *Quem ainda não estudou hoje, bora correr atrás da meta!*";

            navigator.clipboard.writeText(texto).then(() => {
                alert("Ranking copiado com sucesso! Agora é só colar no grupo do WhatsApp 📱");
            });
        }

        function alternarTema() {
            const html = document.documentElement;
            const icone = document.getElementById('icone-tema');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icone.className = "fa-solid fa-moon";
            } else {
                html.classList.add('dark');
                icone.className = "fa-solid fa-sun";
            }
        }

        atualizarTela();
    </script>
</body>
</html>
